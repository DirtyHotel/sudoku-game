<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .sudoku-board {
            border: 2px solid #333;
            display: grid;
            grid-template-columns: repeat(9, 50px);
            grid-gap: 1px;
        }
        .cell {
            width: 50px;
            height: 50px;
            text-align: center;
            line-height: 50px;
            font-size: 24px;
            border: 1px solid #666;
            user-select: none;
        }
        .highlighted-cell {
            background-color: #e6e6fa;
        }
    </style>
</head>
<body>
    <div class="sudoku-board" id="sudokuBoard"></div>
    <input type="number" id="numberInput" min="1" max="9">
    <button onclick="checkAnswer()">Check Answer</button>

    <script>
        const boardSize = 9;
        let gameBoard = [];

        function createSudoku() {
            for (let row = 0; row < boardSize; row++) {
                gameBoard.push(Array(boardSize).fill(0));
            }

            fillRandomly();
        }

        function fillRandomly() {
            for (let row = 0; row < boardSize; row++) {
                for (let col = 0; col < boardSize; col++) {
                    let num;
                    do {
                        num = Math.floor(Math.random() * 9) + 1;
                    } while (!isValid(row, col, num));
                    gameBoard[row][col] = num;
                }
            }
        }

        function isValid(row, col, num) {
            for (let x = 0; x < boardSize; x++) {
                if (gameBoard[row][x] === num || gameBoard[x][col] === num) {
                    return false;
                }
            }

            let startRow = Math.floor(row / 3) * 3;
            let startCol = Math.floor(col / 3) * 3;

            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    if (gameBoard[i + startRow][j + startCol] === num) {
                        return false;
                    }
                }
            }

            return true;
        }

        function renderBoard() {
            const board = document.getElementById('sudokuBoard');
            board.innerHTML = '';

            for (let row = 0; row < boardSize; row++) {
                for (let col = 0; col < boardSize; col++) {
                    let cell = document.createElement('div');
                    cell.classList.add('cell');
                    if ((row + col) % 2 === 1) {
                        cell.classList.add('highlighted-cell');
                    }

                    cell.innerText = gameBoard[row][col] !== 0 ? gameBoard[row][col] : '';
                    board.appendChild(cell);

                    cell.addEventListener('click', () => selectCell(row, col));
                }
            }
        }

        function selectCell(row, col) {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => cell.classList.remove('highlighted-cell'));

            selectedRow = row;
            selectedCol = col;

            cells[selectedRow * boardSize + selectedCol].classList.add('highlighted-cell');

            const inputField = document.getElementById('numberInput');
            inputField.value = '';
        }

        function checkAnswer() {
            const inputField = document.getElementById('numberInput');
            const value = parseInt(inputField.value, 10);
            if (value && isValid(selectedRow, selectedCol, value)) {
                gameBoard[selectedRow][selectedCol] = value;
                renderBoard();
            } else {
                alert('Invalid number or not a valid move. Try again.');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            createSudoku();
            renderBoard();
        });
    </script>
</body>
</html>
